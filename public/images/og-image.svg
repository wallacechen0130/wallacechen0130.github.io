  </text>
  <text x="90" y="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" fill="#CFE5FA">
    Portfolio — Projects, AI / LLM, Unity, Bots &amp; Algorithms
  </text>
  <rect x="90" y="480" width="120" height="6" rx="3" fill="#7FB9E8" />
  <text x="90" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#7FB9E8">
